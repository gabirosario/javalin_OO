<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <h1>Cadastro Usuário</h1>

    <form action="/usuarios/cadastro" method="post">

        <button type="submit">Salvar</button>
    </form>

</body>
